  <title id="title">How mass changes a sliding box’s motion</title>
  <desc id="desc">The horizontal displacement of two otherwise matched Genesis boxes under the same 3 N push. Both start at rest. After one second the 0.50 kg box has moved 1.67 metres and the 1.50 kg box 0.56 metres. At two seconds the displacements are 4.51 and 1.50 metres.</desc>
